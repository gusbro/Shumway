<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebShumway</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#111111" />

  <!-- Filled in by the WebAssembly SDK at publish: the runtime preload hint and
       the import map that resolves ./_framework/dotnet.js to its fingerprinted
       file name. Without both, a published (fingerprinted) build 404s on boot. -->
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</head>
<body>
  <header>
    <h1>WebShumway</h1>
    <p class="sub">Prolog in the browser — the Shumway engine compiled to WebAssembly.</p>
    <div id="examples" class="examples" aria-label="examples"></div>
  </header>

  <div class="panes">
    <section class="pane">
      <h2><label for="program">Program</label> — <span id="current-file">scratch.pl</span></h2>
      <div id="files" class="files" aria-label="workspace files"></div>
      <!-- The editor holds ONE copy of the program: the coloured text IS the
           text being edited. An earlier version drew colours on a second copy
           behind a transparent textarea, which only works while the two lay out
           identically — and when they drift, the caret lands where the text is
           not. -->
      <div id="program" class="editor" contenteditable="plaintext-only"
           role="textbox" aria-multiline="true" aria-label="Program"
           spellcheck="false" autocapitalize="off" autocorrect="off"
           data-placeholder="anc(X, Y) :- par(X, Y).
anc(X, Z) :- par(X, Y), anc(Y, Z).

par(a, b).
par(b, c)."></div>
      <div class="row">
        <button id="consult" type="button">Consult</button>
        <button id="new-file" type="button">New</button>
        <button id="open-file" type="button">Open…</button>
        <button id="save-file" type="button">Save as…</button>
        <button id="share" type="button" title="copy a link containing this program">Share</button>
        <span class="hint">Tab completes a predicate name</span>
      </div>
    </section>

    <section class="pane">
      <h2>Answers
        <button id="clear" type="button" class="heading-action"
                title="clear the transcript">Clear</button></h2>
      <pre id="out" tabindex="0">loading the engine…</pre>
      <p id="status" class="status" aria-live="polite"></p>
      <form id="query-form" autocomplete="off">
        <label for="query" class="prompt">?-</label>
        <input id="query" type="text" spellcheck="false" autocapitalize="off"
               placeholder="anc(a, X)." />
        <button type="submit">Run</button>
        <button id="stop" type="button" title="abandon the running query">Stop</button>
      </form>
    </section>
  </div>
</body>
</html>
