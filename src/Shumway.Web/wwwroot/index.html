<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebShumway</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#111111" />

  <!-- Filled in by the WebAssembly SDK at publish: the runtime preload hint and
       the import map that resolves ./_framework/dotnet.js to its fingerprinted
       file name. Without both, a published (fingerprinted) build 404s on boot. -->
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</head>
<body>
  <header>
    <div class="title">
      <h1>WebShumway</h1>
      <p class="sub">Prolog in the browser — the Shumway engine compiled to WebAssembly.</p>
    </div>
    <button id="theme" type="button" class="icon-button" title="Switch theme"></button>
  </header>

  <div class="panes">
    <section class="pane">
      <h2>Program</h2>

      <div class="bar">
        <label class="visually-hidden" for="workspace">Workspace</label>
        <select id="workspace" title="the workspace these files belong to"></select>
        <button id="new-workspace" type="button">New…</button>
        <button id="delete-workspace" type="button">Delete…</button>
        <button id="export-workspace" type="button" title="download this workspace as a zip">Export</button>
      </div>

      <div id="files" class="files" aria-label="workspace files"></div>

      <!-- The editor holds ONE copy of the program: the coloured text IS the
           text being edited. An earlier version drew colours on a second copy
           behind a transparent textarea, which only works while the two lay out
           identically — and when they drift, the caret lands where the text is
           not. -->
      <div id="program" class="editor" contenteditable="plaintext-only"
           role="textbox" aria-multiline="true" aria-label="Program"
           spellcheck="false" autocapitalize="off" autocorrect="off"
           data-placeholder="anc(X, Y) :- par(X, Y).
anc(X, Z) :- par(X, Y), anc(Y, Z).

par(a, b).
par(b, c)."></div>

      <div class="row">
        <button id="consult" type="button" class="primary">Consult</button>
        <button id="new-file" type="button">New file</button>
        <button id="open-file" type="button">Open…</button>
        <button id="download-file" type="button" title="save this file to your computer">Download</button>
        <button id="share" type="button" title="copy a link containing this program">Share</button>
        <span class="hint">Tab completes a predicate name</span>
      </div>
    </section>

    <section class="pane">
      <h2>Answers
        <button id="clear" type="button" class="heading-action"
                title="clear the transcript">Clear</button></h2>
      <pre id="out" tabindex="0">loading the engine…</pre>
      <p id="status" class="status" aria-live="polite"></p>
      <form id="query-form" autocomplete="off">
        <label for="query" class="prompt">?-</label>
        <input id="query" type="text" spellcheck="false" autocapitalize="off"
               placeholder="anc(a, X)." />
        <button type="submit" class="primary">Run</button>
        <button id="stop" type="button" title="abandon the running query">Stop</button>
      </form>
    </section>
  </div>

  <!-- One dialog, reused: anything that needs a yes before it happens. Native
       <dialog> is modal, focus-trapping and Escape-closing on its own. -->
  <dialog id="confirm">
    <form method="dialog">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-detail"></p>
      <!-- Filled per question: some have two answers, some four. The cancelling
           one is NOT a submit button — in a method="dialog" form Enter presses
           the first submit, so a Cancel there would make Enter mean cancel. -->
      <div class="row end" id="confirm-actions"></div>
    </form>
  </dialog>

  <!-- What a link should carry. A program that spans files is not shareable one
       file at a time, and a whole workspace is a much longer URL — so it is the
       kind of choice only the person sharing can make. -->
  <dialog id="share-dialog">
    <form method="dialog">
      <h3>Share a link</h3>
      <p>The link carries the code itself, in the part of the URL browsers never
         send to a server.</p>
      <div class="row end">
        <button type="button" data-close>Cancel</button>
        <button value="file" class="primary">This file</button>
        <button value="workspace">Whole workspace</button>
      </div>
    </form>
  </dialog>

  <!-- Asking for a name, in the same shape as the confirmation. -->
  <dialog id="prompt-dialog">
    <form method="dialog">
      <h3 id="prompt-title">Name</h3>
      <input id="prompt-input" type="text" spellcheck="false" autocapitalize="off" />
      <div class="row end">
        <!-- NOT a submit button: in a method="dialog" form, Enter submits the
             FIRST submit button, so a Cancel button here would make Enter mean
             cancel — which is exactly what typing a name and pressing Enter did. -->
        <button type="button" data-close>Cancel</button>
        <button value="ok" class="primary">Create</button>
      </div>
    </form>
  </dialog>
</body>
</html>
