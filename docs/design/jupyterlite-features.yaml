# Feature table for the notebook kernels (ADR-073 D17).
# Source of truth: the markdown table is generated from this file, never edited by hand.
# Every row needs a `test`: an acceptance cell run in CI (Playwright) against the built site.
# A row may be `supported` only if its test passes.
# The cells run in jupyterlite/tests/kernel.mjs, against a built site in Chromium,
# Firefox and WebKit, which CI runs (.github/workflows/notebooks.yml).
# A protocol method's test is the notebook server's corpus (tests/jupyter/corpus), which
# sends the request itself; `A  →  B` is a cell A followed by a cell B.
#
# Schema
#   reference:  the Hercutalk version that column `hercutalk_desktop` describes
#   groups[].rows[]:
#     id:        stable identifier (kebab-case)
#     feature:   what the user sees
#     hercutalk_desktop / shumway_prolog_web / hercutalk_web:
#                supported | partial | not_yet_supported | not_applicable | wont_support
#     note:      required for partial and wont_support
#     test:      the acceptance cell (code), or `todo`
#     phase:     plan phase that delivers it (jupyterlite-plan.md)
#
# The hercutalk_desktop column lists what exists in Hercutalk 0.47.0's code. It was not
# re-tested; confirm with Paulo Moura.

reference: { hercutalk: "0.47.0", commit: "865d6fd" }

groups:
  - name: Protocol methods
    rows:
      - { id: m-call,  feature: "call",  hercutalk_desktop: supported, shumway_prolog_web: supported, test: corpus, phase: 2 }
      - { id: m-backend, feature: "backend", hercutalk_desktop: supported, shumway_prolog_web: supported, test: corpus, phase: 2 }
      - { id: m-enable-logging, feature: "enable_logging", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "answers false: no log file is kept", test: corpus, phase: 2 }
      - { id: m-version, feature: "version", hercutalk_desktop: supported, shumway_prolog_web: supported, test: corpus, phase: 2 }
      - { id: m-predicate-docs, feature: "jupyter_predicate_docs", hercutalk_desktop: supported, shumway_prolog_web: supported, test: corpus, phase: 2 }
      - { id: m-protocol, feature: "protocol [ext]", hercutalk_desktop: not_yet_supported, shumway_prolog_web: supported, test: corpus, phase: 2 }

  - name: Cell semantics
    rows:
      - { id: s-query, feature: "query with bindings", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "X = 1, Y = f(X).", phase: 3 }
      - { id: s-multi-term, feature: "several terms in one cell", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "write(hello), nl, X = 1.\nwrite(second).", phase: 3 }
      - { id: s-retry, feature: "retry / jupyter:retry", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "member(X, [a, b]).  →  retry.", phase: 3 }
      - { id: s-dollar-var, feature: "$Var reuses a previous binding", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "X = 3.  →  Y is $X + 1.", phase: 3 }
      - { id: s-halt, feature: "halt / jupyter:halt", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "halt.  →  X = after.", phase: 3 }
      - { id: s-errors, feature: "error reporting", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "X is foo + 1.  →  X = .", phase: 3 }
      - { id: s-clause-cells, feature: "cell with only clauses (O1) [ext]", hercutalk_desktop: not_applicable, shumway_prolog_web: wont_support, note: "decided (O1): a clause in a query cell is an error that points to %%user", test: "p(X) :- q(X).", phase: 2 }
      - { id: s-residual, feature: "residual goals in bindings [ext]", hercutalk_desktop: partial, shumway_prolog_web: supported, note: "Hercutalk shows clpfd domains as `X in Dom`", test: "X in 1..5, X #> 2.", phase: 3 }
      - { id: s-trace, feature: "trace/0,1,2, leash/1", hercutalk_desktop: supported, shumway_prolog_web: partial, note: "jupyter:trace/1 only", test: "jupyter:trace(member(X, [a])).", phase: 3 }

  - name: Helpers (module jupyter)
    rows:
      - { id: h-help, feature: "help/0", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:help.", phase: 3 }
      - { id: h-version, feature: "version/0, version/4, versions/0", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:versions.  →  jupyter:version(Ma, Mi, Pa, _).", phase: 3 }
      - { id: h-magic, feature: "magic/0", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:magic.", phase: 3 }
      - { id: h-pwd-cd, feature: "pwd/0, cd/1", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:pwd.  →  jupyter:cd('..'), jupyter:pwd.", phase: 3 }
      - { id: h-import-library, feature: "import_library/1 [ext]", hercutalk_desktop: not_applicable, shumway_prolog_web: supported, test: "jupyter:import_library(swi:'lib.tar.gz').  →  use_module(library(x)).", phase: 3 }
      - { id: h-print-queries, feature: "print_queries/0,1", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "print_queries/1 is checked by the server's tests", test: "jupyter:print_queries.", phase: 3 }
      - { id: h-print-query-time, feature: "print_query_time/0", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_query_time.", phase: 3 }
      - { id: h-print-bindings, feature: "print_variable_bindings/0", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_variable_bindings.", phase: 3 }
      - { id: h-print-table, feature: "print_table/1,2", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_table(member(X, [a, b])).", phase: 3 }
      - { id: h-print-save-table, feature: "print_and_save_table/3", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_and_save_table(member(N-S, [1-1, 2-4]), csv, 'squares.csv').", phase: 3 }
      - { id: h-show-term, feature: "show_term/1", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "show_term(f(a, g(1, b))).", phase: 4 }
      - { id: h-transition-graph, feature: "print_transition_graph/3,4", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_transition_graph(step/3, 1, 3, 2).", phase: 4 }
      - { id: h-show-graph, feature: "show_graph/2", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "show_graph(state/2, move/3).", phase: 4 }
      - { id: h-sld-tree, feature: "print_sld_tree/1", hercutalk_desktop: partial, shumway_prolog_web: not_yet_supported, note: "not exported in 0.47.0 (commented out of the public list); the client still renders the key", test: todo, phase: 4 }
      - { id: h-show-data, feature: "show_data/1", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "Vega-Lite on the web (ADR-072)", test: "show_data(Data = [type-plot, x-[1, 2, 3], y-[1, 4, 9]]).", phase: 5 }
      - { id: h-display, feature: "display/2 [ext]", hercutalk_desktop: not_yet_supported, shumway_prolog_web: supported, test: "jupyter:display('text/html', '<b>hi</b>').", phase: 3 }
      - { id: h-set-backend, feature: "set_prolog_backend/1", hercutalk_desktop: supported, shumway_prolog_web: not_applicable, test: todo, phase: 3 }

  - name: Cell magics
    rows:
      - { id: c-user, feature: "%%user, %%user+", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "NAME.user.pl for NAME.ipynb (user.pl in a console) + consult in the Prolog variant; Hercutalk writes one user.lgt per directory", test: "%%user\nonly_third(1).  →  %%user+\nonly_third(2).", phase: 3 }
      - { id: c-file, feature: "%%file, %%file+, %%save, %%load", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%file colours.pl\ncolour2(blue).  →  %%file+ colours.pl\ncolour2(green).  →  %%load colours.pl\ncolour2(grey).  →  %%save notes.txt\nnot loaded (", phase: 3 }
      - { id: c-highlight, feature: "%%highlight", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "runs nothing", test: "%%highlight\nfoo(X) :- bar(X).", phase: 3 }
      - { id: c-table, feature: "%%table, %%csv, %%tsv", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "%%tsv is checked by the server's tests", test: "%%table\nmember(X-Y, [a-1, b-2]).  →  %%csv letters.csv\nmember(X, [a, b]).", phase: 3 }
      - { id: c-tree, feature: "%%tree", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%tree\n1 + 2 * 3 - 4", phase: 4 }
      - { id: c-data, feature: "%%data", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-bar, x-[a, b], height-[1, 2]]", phase: 5 }

  - name: Line magics
    rows:
      - { id: l-bindings, feature: "%bindings", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%bindings", phase: 3 }
      - { id: l-queries, feature: "%queries", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%queries", phase: 3 }
      - { id: l-flags, feature: "%flags", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%flags", phase: 3 }
      - { id: l-help, feature: "%help", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%help", phase: 3 }
      - { id: l-magic, feature: "%magic", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%magic", phase: 3 }
      - { id: l-pwd, feature: "%pwd", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%pwd", phase: 3 }
      - { id: l-versions, feature: "%versions", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%versions", phase: 3 }

  - name: Kernel operations
    rows:
      - { id: k-interrupt, feature: "interrupt", hercutalk_desktop: partial, shumway_prolog_web: partial, note: "restarts the server; state is lost (both)", test: "repeat, fail.  →  interrupt", phase: 3 }
      - { id: k-restart, feature: "restart", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "restart  →  X = restarted.", phase: 3 }
      - { id: k-stdin, feature: "read/1 from a cell (input_request)", hercutalk_desktop: not_yet_supported, shumway_prolog_web: supported, note: "desktop column unverified: requests and user input share stdin there", test: "read(X).", phase: 3 }
      - { id: k-complete, feature: "completion", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "X = 1, grandp, completed after %%user defines grandparent/2", phase: 3 }
      - { id: k-inspect, feature: "inspection", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "jupyter:print_table(, inspected", phase: 3 }
      - { id: k-multi, feature: "several notebooks open at once", hercutalk_desktop: supported, shumway_prolog_web: supported, note: "session limit (ADR-068)", test: "%%user\nonly_here(1).  in one notebook, only_here(X).  in another", phase: 3 }
      - { id: k-foreign-notebook, feature: "a notebook of another Prolog kernel opens without asking for a kernel", hercutalk_desktop: not_applicable, shumway_prolog_web: supported, note: "site setting autoStartDefaultKernel (ADR-066)", test: "open a notebook whose kernelspec is prolog_kernel  →  X = here.", phase: 3 }

  - name: Files
    rows:
      - { id: f-consult, feature: "consult a file from the drive", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "consult(facts), colour(C).", phase: 3 }
      - { id: f-write, feature: "files written by Prolog appear in the browser", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "open('out.txt', write, S), write(S, hello), close(S).", phase: 3 }

  - name: Plots (show_data)
    rows:
      - { id: p-plot, feature: "plot", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-plot, x-[1, 2, 3], y-[1, 4, 9], marker-o]", phase: 5 }
      - { id: p-scatter, feature: "scatter", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-scatter, x-[5, 7, 8], y-[99, 86, 87]]", phase: 5 }
      - { id: p-bar, feature: "bar", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-bar, x-[a, b], height-[12, 7], bar_label-[label_type-edge]]", phase: 5 }
      - { id: p-barh, feature: "barh", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-barh, y-[a, b], width-[5, 20]]", phase: 5 }
      - { id: p-hist, feature: "hist", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-hist, x-[1.5, 2.5, 2.5, 3], bins-3]", phase: 5 }
      - { id: p-step, feature: "step", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-step, x-[1, 2, 3], y-[0, 1, 0], where-post]", phase: 5 }
      - { id: p-stackplot, feature: "stackplot", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-stackplot, x-[1, 2], y-[[1, 2], [3, 4]], labels-[a, b]]", phase: 5 }
      - { id: p-errorbar, feature: "errorbar", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-errorbar, x-[1, 2], y-[2.1, 3.9], yerr-[0.3, 0.5]]", phase: 5 }
      - { id: p-boxplot, feature: "boxplot", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-boxplot, x-[[1, 2, 9], [3, 4, 5]]]", phase: 5 }
      - { id: p-pie, feature: "pie", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-pie, x-[45, 30], labels-['A', 'B'], autopct-'%1.1f%%']", phase: 5 }
      - { id: p-ecdf, feature: "ecdf", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-ecdf, x-[3, 1, 4, 1, 5]]", phase: 5 }
      - { id: p-log, feature: "loglog, semilogx, semilogy", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-loglog, x-[1, 2, 4], y-[2, 4, 16]]", phase: 5 }
      - { id: p-stem, feature: "stem", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-stem, x-[1, 2, 3], y-[1, -1, 2]]", phase: 5 }
      - { id: p-eventplot, feature: "eventplot", hercutalk_desktop: supported, shumway_prolog_web: supported, test: "%%data\nData = [type-eventplot, positions-[[1, 3], [2, 5]]]", phase: 5 }
      - { id: p-polar-hexbin, feature: "polar, hexbin", hercutalk_desktop: supported, shumway_prolog_web: not_yet_supported, note: "no reasonable Vega-Lite mapping", test: todo, phase: 5 }

  - name: Widgets
    rows:
      - { id: w-widgets, feature: "widgets, forms, inputs", hercutalk_desktop: supported, shumway_prolog_web: not_yet_supported, note: "needs a configurable callback upstream (ADR-072)", test: todo, phase: 6 }
