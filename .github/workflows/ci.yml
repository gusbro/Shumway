name: CI

# Three lanes: net10.0, net48/x86 and net48/x64 — the netfx-target matrix
# (ADR-043). Each lane arms MSVC for its OWN bitness so the real-DLL native
# interop tests compile a host-matching DLL and actually run (they self-skip
# without a C compiler on PATH — which is how they silently skipped in every
# pre-CI gate). Individual test projects are built directly; the solution is
# NOT built wholesale because Shumway.Web needs the wasm-tools workload.
# One suite per step: pwsh only propagates the LAST command's exit code, so
# stacking suites in one step would mask an intermediate failure.
#
# Shumway.Tests.DialectInterop is deliberately absent: it consults real
# Scryer/SWI library trees from local paths that CI does not have.

on:
  push:
    branches: [main, netfx-target]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net10:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Neutralize vcvars Platform
        run: Add-Content -Path $env:GITHUB_ENV -Value "Platform=AnyCPU"
      # The test steps below build the ENGINE and nothing else, so the CLIs had
      # no cover at all: shumway-link, shumway-compile, shumway-lib,
      # shumway-disasm, shumway-dap and the dist collector are referenced by no
      # test project, and could be broken on main with CI green. Nearly free in
      # wall clock: it builds what the tests were about to build anyway, and
      # they then find it done. It goes AFTER the Platform neutralisation --
      # vcvars leaves Platform=x64 set, which the build would trip over.
      - name: Build everything (the CLIs have no tests to build them)
        run: dotnet build Shumway.slnx -c Release --nologo -v q
      - name: Core
        run: dotnet test tests/Shumway.Tests.Core -c Release -f net10.0
      - name: Interpreter
        run: dotnet test tests/Shumway.Tests.Interpreter -c Release -f net10.0
      - name: Compiler
        run: dotnet test tests/Shumway.Tests.Compiler -c Release -f net10.0
      - name: IsoConformance
        run: dotnet test tests/Shumway.Tests.IsoConformance -c Release -f net10.0
      - name: Embedding (parallel)
        run: powershell -File tests/test-embedding-parallel.ps1 -Configuration Release
      # A failed test's message lives in the per-bucket logs, which die with
      # the runner — surface them (the job log only carries the test NAME).
      - name: Upload parallel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-logs-net10
          path: TestResults/parallel/*.log

  net48-x86:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          # cl targets x86 so the native tests' DLLs load in the x86 testhost.
          arch: amd64_x86
      - name: Neutralize vcvars Platform
        run: Add-Content -Path $env:GITHUB_ENV -Value "Platform=AnyCPU"
      - name: Core
        run: dotnet test tests/Shumway.Tests.Core -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x86
      - name: Interpreter
        run: dotnet test tests/Shumway.Tests.Interpreter -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x86
      - name: Compiler
        run: dotnet test tests/Shumway.Tests.Compiler -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x86
      - name: IsoConformance
        run: dotnet test tests/Shumway.Tests.IsoConformance -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x86
      - name: Embedding (parallel)
        run: powershell -File tests/test-embedding-parallel.ps1 -Configuration Release -Framework net48 -Platform x86
      - name: Upload parallel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-logs-net48-x86
          path: TestResults/parallel/*.log
      - name: Smoke build (32-bit)
        run: dotnet build tests/Shumway.Smoke.Net48 -c Release -p:SmokeBitness=x86 -p:ShumwayNetFx=true -t:Rebuild -v q
      - name: Smoke run (32-bit process, Tier-0 + Tier-1)
        run: .\tests\Shumway.Smoke.Net48\bin\Release\net48\shumway-smoke-net48.exe

  net48-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Neutralize vcvars Platform
        run: Add-Content -Path $env:GITHUB_ENV -Value "Platform=AnyCPU"
      - name: Core
        run: dotnet test tests/Shumway.Tests.Core -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x64
      - name: Interpreter
        run: dotnet test tests/Shumway.Tests.Interpreter -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x64
      - name: Compiler
        run: dotnet test tests/Shumway.Tests.Compiler -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x64
      - name: IsoConformance
        run: dotnet test tests/Shumway.Tests.IsoConformance -c Release -f net48 -p:ShumwayNetFx=true -- RunConfiguration.TargetPlatform=x64
      - name: Embedding (parallel)
        run: powershell -File tests/test-embedding-parallel.ps1 -Configuration Release -Framework net48 -Platform x64
      - name: Upload parallel logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-logs-net48-x64
          path: TestResults/parallel/*.log
